# RAX3000QY 固件编译：ImmortalWrt 21.02 / QSDK 5.4（Wi-Fi + NSS 硬件加速）
#
# 源码：kkstone/immortalwrt-ipq50xx（openwrt-21.02 分支）
# 目标：ipq50xx / arm / cmcc_rax3000q
# 产物：openwrt-ipq50xx-arm-cmcc_rax3000q-nand-factory.ubi     （U-Boot 网页首次刷入）
#       openwrt-ipq50xx-arm-cmcc_rax3000q-nand-sysupgrade.bin  （已在 OpenWrt 上升级）
name: RAX3000QY 固件编译

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '开启 SSH 调试（tmate）'
        required: false
        default: false
        type: boolean
  repository_dispatch:

env:
  REPO_URL: https://github.com/kkstone/immortalwrt-ipq50xx
  REPO_BRANCH: openwrt-21.02
  CONFIG_FILE: configs/qsdk-nss.config
  DIY_SH: scripts/diy-qsdk.sh
  TARGET_PATH: ipq50xx/arm
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        run: |
          set -x
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules /usr/local/share/chromium \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/graalvm || true
          sudo apt-get -qq clean || true
          df -h

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5 libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip \
            p7zip-full patch pkgconf python2.7 python3 python3-pip python3-ply \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir && sudo chown "$USER:$GROUPS" /workdir

      - name: 克隆源码（QSDK 分支）
        working-directory: /workdir
        run: |
          set -x
          git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
          cd openwrt
          git log -1 --format='HEAD = %H (%ci)' | tee "$GITHUB_WORKSPACE/openwrt-head.txt"
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: ccache 缓存
        continue-on-error: true
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: 'true'
          mixkey: 'immortalwrt21-ipq50xx-passwall'
          prefix: ${{ github.workspace }}/openwrt

      - name: 升级 golang（源自带 1.19 版本过低）
        working-directory: /workdir/openwrt
        run: |
          # ImmortalWrt 21.02 的 golang 是 1.19，而部分包的 go.mod 要求
          # go >= 1.20，不换会直接编译失败
          rm -rf feeds/packages/lang/golang
          mkdir -p feeds/packages/lang
          git clone --depth 1 https://github.com/kenzok8/golang -b 1.25 feeds/packages/lang/golang
          grep -E 'GO_VERSION' feeds/packages/lang/golang/golang/Makefile 2>/dev/null || true

      - name: 更新并安装 feeds
        working-directory: /workdir/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: DIY（载入配置 + 设备补丁）
        working-directory: /workdir/openwrt
        run: |
          chmod +x "$GITHUB_WORKSPACE/$DIY_SH"
          "$GITHUB_WORKSPACE/$DIY_SH"

      - name: 校验设备、关键包与补丁
        working-directory: /workdir/openwrt
        run: |
          set -e
          echo "== 目标设备 =="
          grep -E '^CONFIG_TARGET_ipq50xx_arm_DEVICE_cmcc_rax3000q=y' .config

          echo "== 核心包 =="
          for p in luci-app-passwall xray-core; do
            grep -q "^CONFIG_PACKAGE_${p}=y" .config || {
              echo "::error::${p} 没有被选中"
              exit 1
            }
          done

          echo "== 设备块补丁是否生效 =="
          grep -q 'rax3000qy' target/linux/ipq50xx/image/Makefile || {
            echo "::error::SUPPORTED_DEVICES 补丁未生效（将无法识别 rax3000qy）"
            exit 1
          }
          grep -q 'nand-sysupgrade' target/linux/ipq50xx/image/Makefile || {
            echo "::error::sysupgrade 镜像未补回（以后只能进 U-Boot 刷机）"
            exit 1
          }

          echo "== 数据源已失效的包必须彻底关闭（=y 和 =m 都会触发下载）=="
          ! grep -qE '^CONFIG_PACKAGE_v2ray-geodata=[ym]' .config || {
            echo "::error::v2ray-geodata 仍处于开启状态（数据源已 404，会在下载阶段失败）"
            exit 1
          }

          if grep -qE '^CONFIG_PACKAGE_v2ray-core=[ym]' .config; then
            echo "::warning::v2ray-core 仍在编译列表中，会增加体积与编译时间"
          fi

          echo "== 编译规模 =="
          echo "  打进固件的包(=y): $(grep -c '^CONFIG_PACKAGE_.*=y' .config || true)"
          echo "  仅生成 ipk 的包(=m): $(grep -cE '^CONFIG_PACKAGE_.*=m$' .config || true)"

      - name: 叠加自定义 files/（Kwrt 风格默认设置）
        if: hashFiles('files/**') != ''
        run: |
          mkdir -p /workdir/openwrt/files
          cp -a "$GITHUB_WORKSPACE/files/." /workdir/openwrt/files/
          chmod +x /workdir/openwrt/files/etc/uci-defaults/*
          find /workdir/openwrt/files -type f | sort

      - name: Lua 语法校验（自定义的 LuCI 应用）
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y lua5.1
          find "$GITHUB_WORKSPACE/files/usr/lib/lua" -name '*.lua' -print0 \
            | xargs -0 -n1 luac5.1 -p
          echo "Lua 语法检查通过"

      - name: 预置 QSDK 内核源码（官方链接常失效，失败则回落到正常下载）
        working-directory: /workdir/openwrt
        run: |
          mkdir -p dl
          wget -q --timeout=60 -O dl/backports-20210222-5.4-qsdk-11.5.0.5.tar.xz \
            "https://www.dropbox.com/scl/fi/9ts30p2csnlb9imaf8k68/backports-20210222-5.4-qsdk-11.5.0.5.tar.xz?rlkey=sntbyfjgg86gu2uoocgb9ggp1&st=7w81hl56&dl=1" || rm -f dl/backports-20210222-5.4-qsdk-11.5.0.5.tar.xz
          wget -q --timeout=60 -O dl/linux-5.4-qsdk-11.5.0.5.tar.xz \
            "https://www.dropbox.com/scl/fi/gu7ge6jmefn72ttuop1zs/linux-5.4-qsdk-11.5.0.5.tar.xz?rlkey=tdpq0ye35x290frbh7i8uqrm8&st=jjvegqrr&dl=1" || rm -f dl/linux-5.4-qsdk-11.5.0.5.tar.xz
          find dl -size -1024c -exec ls -l {} \; -exec rm -f {} \; || true

      - name: 下载依赖包
        working-directory: /workdir/openwrt
        run: |
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -exec ls -l {} \; -exec rm -f {} \; || true

      - name: SSH 调试（仅当手动勾选）
        if: ${{ inputs.ssh }}
        uses: owenthereal/action-upterm@v1

      - name: 编译固件
        id: compile
        working-directory: /workdir/openwrt
        run: |
          echo "$(nproc) 线程编译"
          make -j"$(nproc)" || make -j1 || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: 收集产物
        if: steps.compile.outputs.status == 'success'
        run: |
          set -x
          mkdir -p out
          ls -lh /workdir/openwrt/bin/targets/${TARGET_PATH}/
          cp -a /workdir/openwrt/bin/targets/${TARGET_PATH}/*factory*.bin out/ 2>/dev/null || true
          cp -a /workdir/openwrt/bin/targets/${TARGET_PATH}/*sysupgrade*.bin out/ 2>/dev/null || true
          cp -a /workdir/openwrt/bin/targets/${TARGET_PATH}/*.ubi out/ 2>/dev/null || true
          cp -a /workdir/openwrt/bin/targets/${TARGET_PATH}/profiles.json out/ 2>/dev/null || true
          cp -a /workdir/openwrt/.config out/config.final.txt || true
          ls -lh out/
          {
            echo "## 编译完成"
            echo ""
            cat "$GITHUB_WORKSPACE/openwrt-head.txt"
            echo ""
            echo "### 产物"
            echo '```'
            ls -lh out/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-qsdk-ipq50xx-${{ github.run_number }}
          path: out/
          if-no-files-found: warn

      - name: 失败时保存排查信息
        if: failure()
        run: |
          mkdir -p debug
          cp /workdir/openwrt/.config debug/ 2>/dev/null || true
          cp -r /workdir/openwrt/logs debug/ 2>/dev/null || true

      - name: 上传排查信息
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qsdk-debug-${{ github.run_number }}
          path: debug/
          if-no-files-found: ignore

      - name: 发布 Release
        if: steps.compile.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: qsdk-nss-ipq50xx-${{ github.run_number }}
          name: RAX3000QY QSDK NSS #${{ github.run_number }}
          body: |
            ImmortalWrt 21.02 + QSDK 5.4（Wi-Fi + NSS 硬件加速），适用于 CMCC RAX3000Q / RAX3000QY。

            预置：LuCI 中文界面 + Argon 主题
            默认：管理地址 http://192.168.10.1，root / root，SSID RAX3000（开放网络）

            刷机：进 U-Boot 网页刷 `nand-factory.ubi`；
            已运行 OpenWrt 的机器用 `nand-sysupgrade.bin` 升级（保留配置）。
          files: out/*
          fail_on_unmatched_files: false
